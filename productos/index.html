<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - Supermercado</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../firebase-config.js"></script>
</head>
<body>

<div class="page-container">
    <div class="header">
        <h1>🛒 Gestión de Productos</h1>
        <span class="badge">Sistema de Supermercado</span>
    </div>

    <div class="toolbar">
        <input type="text" id="search" class="search" placeholder="Buscar producto...">
        <button class="btn btn-primary" id="btnNuevo">+ Nuevo Producto</button>
    </div>

    <div class="table-wrapper">
        <table id="tablaProductos">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Proveedor</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody">
            </tbody>
        </table>
    </div>
    <div class="count" id="count"></div>
</div>

<!-- Modal Nuevo/Editar -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Nuevo Producto</h2>
        <input type="hidden" id="productoId">
        <div class="form-group">
            <label for="nombre">Nombre del producto</label>
            <input type="text" id="nombre" placeholder="Ej: Leche Entera 1L">
        </div>
        <div class="form-group">
            <label for="categoria">Categoría</label>
            <select id="categoria">
                <option value="">Seleccione...</option>
                <option value="Lácteos">Lácteos</option>
                <option value="Panadería">Panadería</option>
                <option value="Abarrotes">Abarrotes</option>
                <option value="Carnes">Carnes</option>
                <option value="Frutas y Verduras">Frutas y Verduras</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Limpieza">Limpieza</option>
                <option value="Otros">Otros</option>
            </select>
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" id="precio" min="0" placeholder="Ej: 1200">
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" id="stock" min="0" placeholder="Ej: 50">
        </div>
        <div class="form-group">
            <label for="proveedor">Proveedor</label>
            <input type="text" id="proveedor" placeholder="Ej: Soprole">
        </div>
        <div class="modal-actions">
            <button class="btn btn-secondary" id="btnCancelar">Cancelar</button>
            <button class="btn btn-primary" id="btnGuardar">Guardar</button>
        </div>
    </div>
</div>

<div class="notification" id="notification"></div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
        getFirestore,
        collection,
        onSnapshot,
        addDoc,
        updateDoc,
        deleteDoc,
        doc,
        query,
        orderBy
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    initializeApp(firebaseConfig);
    const db = getFirestore();
    const colRef = collection(db, 'productos');

    let productos = [];

    function formatearMoneda(valor) {
        return '$' + Number(valor).toLocaleString('es-CL');
    }

    function render() {
        const termino = document.getElementById('search').value.toLowerCase();
        const tbody = document.getElementById('tbody');
        const filtrados = productos.filter(p =>
            p.nombre.toLowerCase().includes(termino) ||
            p.categoria.toLowerCase().includes(termino) ||
            p.proveedor.toLowerCase().includes(termino)
        );

        document.getElementById('count').textContent = 'Total: ' + productos.length + ' producto(s)';

        if (filtrados.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="empty-msg">No hay productos registrados</td></tr>';
            return;
        }

        tbody.innerHTML = filtrados.map(p => `
            <tr>
                <td>${p.id}</td>
                <td><strong>${p.nombre}</strong></td>
                <td><span class="categoria-badge">${p.categoria}</span></td>
                <td>${formatearMoneda(p.precio)}</td>
                <td>${p.stock}</td>
                <td>${p.proveedor}</td>
                <td>
                    <div class="actions">
                        <button class="btn btn-warning" onclick="editar('${p.docId}')">Editar</button>
                        <button class="btn btn-danger" onclick="eliminar('${p.docId}')">Eliminar</button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    document.getElementById('search').addEventListener('input', render);

    const modal = document.getElementById('modal');

    document.getElementById('btnNuevo').addEventListener('click', () => {
        document.getElementById('modalTitle').textContent = 'Nuevo Producto';
        document.getElementById('productoId').value = '';
        document.getElementById('nombre').value = '';
        document.getElementById('categoria').value = '';
        document.getElementById('precio').value = '';
        document.getElementById('stock').value = '';
        document.getElementById('proveedor').value = '';
        modal.classList.add('active');
    });

    window.editar = function (docId) {
        const p = productos.find(item => item.docId === docId);
        if (!p) return;
        document.getElementById('modalTitle').textContent = 'Editar Producto';
        document.getElementById('productoId').value = docId;
        document.getElementById('nombre').value = p.nombre;
        document.getElementById('categoria').value = p.categoria;
        document.getElementById('precio').value = p.precio;
        document.getElementById('stock').value = p.stock;
        document.getElementById('proveedor').value = p.proveedor;
        modal.classList.add('active');
    };

    window.eliminar = async function (docId) {
        const p = productos.find(item => item.docId === docId);
        if (!p) return;
        if (!confirm('¿Eliminar el producto "' + p.nombre + '"?')) return;
        try {
            await deleteDoc(doc(db, 'productos', docId));
            notificar('Producto eliminado', 'success');
        } catch (error) {
            console.error(error);
            notificar('Error al eliminar', 'error');
        }
    };

    document.getElementById('btnCancelar').addEventListener('click', () => {
        modal.classList.remove('active');
    });

    modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.classList.remove('active');
    });

    document.getElementById('btnGuardar').addEventListener('click', async () => {
        const docId = document.getElementById('productoId').value;
        const nombre = document.getElementById('nombre').value.trim();
        const categoria = document.getElementById('categoria').value;
        const precio = parseFloat(document.getElementById('precio').value);
        const stock = parseInt(document.getElementById('stock').value);
        const proveedor = document.getElementById('proveedor').value.trim();

        if (!nombre || !categoria || isNaN(precio) || isNaN(stock) || !proveedor) {
            notificar('Todos los campos son obligatorios', 'error');
            return;
        }

        const datos = { nombre, categoria, precio, stock, proveedor };

        try {
            if (docId) {
                await updateDoc(doc(db, 'productos', docId), datos);
                notificar('Producto actualizado', 'success');
            } else {
                const proximoNumero = productos.length
                    ? Math.max(...productos.map(p => p.id)) + 1
                    : 1;
                await addDoc(colRef, Object.assign({ numero: proximoNumero }, datos));
                notificar('Producto agregado', 'success');
            }
            modal.classList.remove('active');
        } catch (error) {
            console.error(error);
            notificar('Error al guardar', 'error');
        }
    });

    onSnapshot(
        query(colRef, orderBy('numero', 'asc')),
        (snapshot) => {
            productos = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                productos.push({
                    docId: docSnap.id,
                    id: data.numero,
                    nombre: data.nombre,
                    categoria: data.categoria,
                    precio: data.precio,
                    stock: data.stock,
                    proveedor: data.proveedor
                });
            });
            render();
        },
        (error) => {
            console.error(error);
            notificar('Error al cargar los datos de Firebase', 'error');
        }
    );

    function notificar(mensaje, tipo) {
        const el = document.getElementById('notification');
        el.textContent = mensaje;
        el.className = 'notification ' + tipo;
        el.classList.add('show');
        clearTimeout(el._timer);
        el._timer = setTimeout(() => el.classList.remove('show'), 2500);
    }
</script>

</body>
</html>
